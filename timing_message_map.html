<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#191919;--sub:#6b7280;--line:#e5e7eb;--y:#fee500;--k:#2e7d32;--p:#1565c0;--x:#9e9e9e;--warn:#e65100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.bar b{font-size:12.5px;color:var(--sub);font-weight:600;margin-right:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-left:auto;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;overflow-x:auto}
.col{background:var(--card);border-radius:12px;padding:10px;min-width:170px;position:relative}
.col:not(:last-child)::after{content:"→";position:absolute;right:-10px;top:12px;color:#aaa;font-size:15px}
.col h2{font-size:13.5px;margin:0 0 2px}
.col .q{font-size:11.5px;color:var(--sub);margin-bottom:8px}
.grp{font-size:11px;color:var(--sub);margin:8px 0 3px;font-weight:600}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;margin:4px 0;font-size:12.5px;cursor:pointer;line-height:1.35}
.dl{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:0 5px;margin-right:4px}.dl.k{background:#e8f5e9;color:#2e7d32}.dl.p{background:#e3f2fd;color:#1565c0}
.chip small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.chip .w{color:var(--warn)}
.chip.sel{background:#fffbe0;border-color:#e6cf00;box-shadow:0 0 0 2px #fee50099 inset}
.chip.dim{opacity:.25}
.chip.nofit{opacity:.45;border-style:dashed}
.chip{position:relative}.chip.nofit{padding-right:46px}.chip.nofit::after{content:'안 맞음';position:absolute;top:6px;right:8px;font-size:10px;color:#e53935}
.chip.bad{border-color:#e53935;box-shadow:0 0 0 2px #e5393566 inset}
.verdict{background:var(--card);border-radius:12px;padding:12px 16px;margin-top:14px;border-left:6px solid #ccc}
.verdict.ok{border-left-color:#2e7d32}.verdict.ng{border-left-color:#e53935}.verdict.mid{border-left-color:#9e9e9e}
.verdict h3{font-size:14px;margin:0 0 6px}
.out{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:14px}
.box{background:var(--card);border-radius:12px;padding:14px 16px}
.box h3{font-size:14px;margin:0 0 8px}
.sent{font-size:15px;line-height:1.8}
.sent span{background:#fffbe0;border-radius:6px;padding:1px 6px;margin:0 1px;white-space:nowrap}
.sent span.empty{background:#f1f3f5;color:#aaa}
ul{margin:4px 0;padding-left:18px}li{margin:2px 0}
.none{color:var(--sub);font-size:13px}
.reset{margin-left:4px}

.screens{background:var(--card);border-radius:12px;padding:14px 16px;margin-top:14px}
.screens h3{font-size:14px;margin:0 0 4px}
.screens .hint{font-size:12px;color:var(--sub);margin-bottom:10px}
.ph-row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.ph-col{width:300px}
.ph-cap{font-size:13px;font-weight:700;margin-bottom:6px}
.ph-cap span{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-right:6px}
.ph{width:300px;height:470px;border-radius:24px;border:7px solid #1f1f1f;overflow:hidden;display:flex;flex-direction:column;background:#b2c7da;font-size:12.5px;position:relative}
.ph.pc{background:#f7f8fa}.ph.lock{background:linear-gradient(160deg,#3b4a6b,#1d2333);color:#fff}.ph.oc{background:#c9d6df}.ph.web{background:#fff}

.ph .bd{flex:1;padding:4px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.pf{display:flex;gap:7px}.av{width:30px;height:30px;border-radius:11px;background:#8d6e63;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nm{font-size:10.5px;color:#444;margin-bottom:3px}
.bub{background:#fff;border-radius:11px;padding:7px 9px;line-height:1.45;max-width:220px}
.me{align-self:flex-end;background:#fee500;border-radius:11px;padding:7px 9px;max-width:200px}
.card{background:#fff;border-radius:11px;width:220px;overflow:hidden}
.card .hd{background:#fee500;padding:6px 9px;font-size:11.5px;font-weight:700}
.card .tx{padding:8px 9px;line-height:1.45}.card .tt{font-weight:700;margin-bottom:3px}
.card .b{border-top:1px solid #eee;padding:7px;text-align:center}.card .b.y{background:#fee500;font-weight:700}
.tg{display:inline-block;font-size:10px;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600}
.tg.ad{background:#fff3e0;color:#e65100}.tg.sg{background:#fee500;color:#191919}.tg.in{background:#e3f2fd;color:#1565c0}

.sug .big{font-size:14.5px;font-weight:700;margin:4px 0 6px}
.cp{display:inline-block;background:#f1f3f5;border-radius:9px;padding:2px 7px;font-size:11px;margin:2px 3px 2px 0}
.cp.on{background:#fee500;font-weight:700}
.pv{background:#f7f8fa;border-radius:8px;padding:7px 9px;font-size:11.5px;margin:6px 0}
.go{background:#fee500;border-radius:8px;text-align:center;padding:7px;font-weight:700;margin-top:6px}
.push{background:rgba(255,255,255,.92);color:#191919;border-radius:14px;padding:9px 11px;margin:0 4px;line-height:1.45}
.push .ap{font-size:11px;color:#666;margin-bottom:2px}
.clock{text-align:center;font-size:44px;font-weight:300;margin:26px 0 4px}.date{text-align:center;font-size:12px;margin-bottom:22px;opacity:.8}
.note2{font-size:11px;color:#666;margin-top:6px;line-height:1.5}
.warn2{background:#ffebee;color:#c62828;border-radius:8px;padding:6px 10px;font-size:12px;margin-bottom:10px}
.webbar{background:#2b2f36;color:#fff;padding:8px 12px;font-size:12px;font-weight:700}
.tbl{width:100%;font-size:11px;border-collapse:collapse}.tbl td{border-bottom:1px solid #eee;padding:4px}
@media(max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.col::after{display:none}.out{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>타이밍메시지 그림 펼치기</h1>
<div class="sub">카드를 눌러 축마다 선택하면 아래에 시나리오와 쟁점이 모여요. 필터로 조건에 안 맞는 선택지를 흐리게 만들어 좁혀 볼 수 있어요. 2026-11-10 아이데이션용</div>

<div class="bar">
<b>예시 시나리오</b>
<button class="btn" data-preset="salon">미용실 재예약</button>
<button class="btn" data-preset="slot">미용실 빈 시간</button>
<button class="btn" data-preset="imweb">아임웹 쇼핑몰</button>
<button class="btn" data-preset="cu">CU 점주</button>
<button class="btn" data-preset="linkpay">오픈채팅 판매자</button>
<button class="btn" data-preset="coupon">쿠폰 미사용 리마인드</button>
<button class="btn reset" id="reset">초기화</button>
<span class="sep"></span>
<b>좁히기</b>
<button class="btn" data-filter="kakao">카카오 데이터만</button>
<button class="btn" data-filter="now">지금 있는 것만</button>
<div class="legend">신호·결과 카드의 데이터 위치: <span class="dl k">카카오 데이터</span><span class="dl p">제휴사 데이터</span></div>
</div>

<div class="flow" id="flow"></div>

<div class="verdict mid" id="verdict"></div>
<div class="screens"><h3>화면 예시</h3><div class="hint">고른 카드 중 축마다 첫 번째 것으로 그려요. 비어 있는 축은 기본값(매장 사장님, 예약하기, 메시지 AI 칩, 채널 친구)으로 채워요. 가상 매장 예시</div><div id="warn2"></div><div class="ph-row" id="phones"></div></div>
<div class="out">
<div class="box"><h3>지금 고른 시나리오</h3><div class="sent" id="sent"></div></div>
<div class="box"><h3>걸리는 것</h3><div id="issues"></div></div>
</div>
</div>

function check(){
 const bad=new Set(),msg=[];
 Object.entries(RULES).forEach(([id,r])=>{
  const it=byId[id]; if(!sel[it.ax].has(id)) return;
  Object.entries(r).forEach(([k,v])=>{
   if(k==='any'){
    const cur=[...sel[v.ax]]; if(!cur.length) return;
    if(!cur.some(x=>v.ok.includes(x))){bad.add(id);msg.push(`'${it.n}' — ${v.why}`);}
   } else {
    [...sel[k]].forEach(x=>{ if(!v.ok.includes(x)){bad.add(id);bad.add(x);msg.push(`'${it.n}' × '${byId[x].n}' — ${v.why}`);} });
   }
  });
 });
 // 안 맞음 안내: 고르지 않은 카드 중 지금 선택과 어긋나는 것
 const nofit=new Set();
 Object.entries(RULES).forEach(([id,r])=>{
  const it=byId[id];
  Object.entries(r).forEach(([k,v])=>{
   const ax=k==='any'?v.ax:k;
   if(sel[it.ax].has(id)){ // 고른 카드가 다른 축을 제한
    AX.find(a=>a.id===ax).items.forEach(o=>{ if(!sel[ax].has(o.id) && !v.ok.includes(o.id) && k!=='any') nofit.add(o.id); });
   } else { // 다른 축 선택 때문에 이 카드가 안 맞음
    const cur=[...sel[ax]]; if(cur.length && !cur.some(x=>v.ok.includes(x))) nofit.add(id);
   }
  });
 });
 return {bad,msg,nofit};
}

   b.className='chip'+(sel[a.id].has(i.id)?' sel':'')+(passes(i)?'':' dim')+(CK.bad.has(i.id)?' bad':'')+(!sel[a.id].has(i.id)&&CK.nofit.has(i.id)?' nofit':'');
   const DL=(a.id==='src'||a.id==='res')&&i.d!=='x'?(i.d==='kp'?'<span class="dl k">카카오 데이터</span><span class="dl p">제휴사 데이터</span>':`<span class="dl ${i.d}">${i.d==='k'?'카카오 데이터':'제휴사 데이터'}</span>`):'';
   b.innerHTML=`${i.n}<small>${DL}${i.note||''}${i.legal?' <span class="w">· 법무</span>':''}${i.now?'':' · 아직 없음'}</small>`;
   b.onclick=()=>{sel[a.id].has(i.id)?sel[a.id].delete(i.id):sel[a.id].add(i.id);render();};
   c.appendChild(b);
  });
  f.appendChild(c);
 });
 const pick=ax=>[...sel[ax]].map(x=>byId[x].n);
 const sp=(ax,ph)=>{const v=pick(ax);return v.length?v.map(x=>`<span>${x}</span>`).join(' / '):`<span class="empty">${ph}</span>`};
 document.getElementById('sent').innerHTML=
  `카카오가 ${sp('src','신호')}로 ${sp('sig','상황')}을 찾으면, ${sp('sel','판매자')}가 ${sp('tp','접점')}에서 제안을 받아, ${sp('rcv','받는 사람')}에게 ${sp('how','방식')}으로 보내고, ${sp('res','결과')}로 이어진다.`;
 const iss=new Set(),lg=new Set();let any=0,ext=0;
 AX.forEach(a=>sel[a.id].forEach(x=>{const i=byId[x];any=1;if(i.issue)iss.add(i.issue);if(i.legal)lg.add(i.legal);if(i.d==='p')ext=1;}));
 if([...sel.sig].some(x=>byId[x].d!=='x')) lg.add(COMMON_LEGAL);
 if(ext) iss.add('데이터가 카카오 밖에 있음 → 제휴사 협조 또는 처리위탁 구조 필요');
 let h='';
 if(lg.size) h+='<div class="grp">법무·개인정보</div><ul>'+[...lg].map(x=>`<li>${x}</li>`).join('')+'</ul>';
 if(iss.size) h+='<div class="grp">실행</div><ul>'+[...iss].map(x=>`<li>${x}</li>`).join('')+'</ul>';
 document.getElementById('issues').innerHTML=h||`<div class="none">${any?'특별히 걸리는 것 없음':'카드를 고르면 여기에 모여요'}</div>`;
 const empty=AX.filter(a=>!sel[a.id].size).map(a=>a.t.replace(/^\S+ /,''));
 const v=document.getElementById('verdict');
 if(!any){v.className='verdict mid';v.innerHTML='<h3>조합 판정</h3><div class="none">카드를 고르면 말이 되는 조합인지 판정해요</div>';}
 else if(CK.msg.length){v.className='verdict ng';v.innerHTML='<h3>말이 안 돼요</h3><ul>'+[...new Set(CK.msg)].map(x=>`<li>${x}</li>`).join('')+'</ul>';}
 else if(empty.length){v.className='verdict mid';v.innerHTML=`<h3>아직 판단 전</h3><div class="none">어긋나는 건 없어요. 비어 있는 축: ${empty.join(', ')}</div>`;}
 else {v.className='verdict ok';v.innerHTML='<h3>말이 돼요</h3><div class="none">고른 카드끼리 어긋나는 조합이 없어요. 오른쪽 걸리는 것만 확인하면 돼요</div>';}
 drawPhones(CK);
 document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',!!filt[b.dataset.filter]));
}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
 const p=PRE[b.dataset.preset];AX.forEach(a=>sel[a.id]=new Set(p[a.id]||[]));
 document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('on',x===b));render();});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filt[b.dataset.filter]^=1;render();});
document.getElementById('reset').onclick=()=>{AX.forEach(a=>sel[a.id]=new Set());filt={kakao:0,now:0};document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('on'));render();};
render();
</script>
</body></html>
