<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>알림톡 가상 화면 · 파트너센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{word-break:keep-all;overflow-wrap:anywhere;font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;color:#191919;background:#f7f7f7;min-width:1000px}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:0;background:none}
/* GNB */
.gnb{height:70px;background:#fff;border-bottom:1px solid #ececec;display:flex;align-items:center;padding:0 30px;position:sticky;top:0;z-index:10}
.logo{font-size:19px;font-weight:800;letter-spacing:-.5px}
.logo small{font-size:16px;font-weight:600;color:#949494;margin-left:10px;letter-spacing:0}
.gnb nav{display:flex;gap:36px;margin-left:80px;font-size:16px}
.gnb nav b{font-weight:700}
.gnb nav span::after{content:" ⌄";color:#aaa;font-size:12px}
.gnb .right{margin-left:auto;display:flex;gap:22px;font-size:15px}
.nbadge{display:inline-flex;width:16px;height:16px;border-radius:50%;background:#ff5a2a;color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-left:4px;vertical-align:1px}
/* layout */
.wrap{display:flex;min-height:calc(100vh - 70px)}
.lnb{width:247px;background:#fff;border-right:1px solid #ececec;padding:24px 12px;flex:none}
.lnb .ch{display:flex;align-items:center;gap:12px;padding:8px 12px 20px;border-bottom:1px solid #ececec;margin:0 8px 14px;font-size:15px}
.avatar{width:28px;height:28px;border-radius:50%;background:#e9e9e9;border:1px solid #ddd;flex:none}
.lnb a.item{display:flex;align-items:center;gap:16px;height:50px;padding:0 12px;border-radius:6px;font-size:16px;margin-bottom:8px}
.lnb a.item.on{background:rgba(0,0,0,.06);font-weight:600}
.lnb a.item:hover{background:rgba(0,0,0,.04)}
.ico{width:26px;height:26px;flex:none;stroke:#191919;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tagnew{font-size:10px;font-weight:700;color:#fff;background:#ff5a2a;border-radius:9px;padding:2px 6px;margin-left:-8px}
.tagblue{font-size:11px;color:#3a6fd8;background:#eaf0fc;border-radius:4px;padding:2px 6px;margin-left:-8px}
.cnt35{font-size:11px;font-weight:700;color:#fff;background:#ff5a2a;border-radius:9px;padding:1px 6px;margin-left:-10px}
.lnb .ext{background:#f4f4f4}
/* 2-depth */
.rail{width:75px;background:#fff;border-right:1px solid #ececec;padding:24px 0;flex:none;display:flex;flex-direction:column;align-items:center;gap:32px}
.rail a{position:relative}
.rail a.on .ico{fill:#191919;stroke:#191919}
.rail a.on .ico.keep{fill:none}
.rail .dot{position:absolute;top:-6px;right:-10px}
.sub{width:247px;background:#fff;border-right:1px solid #ececec;padding:40px 12px;flex:none}
.sub h2{font-size:26px;font-weight:700;padding:0 16px;margin-bottom:38px}
.sub a{display:flex;align-items:center;height:44px;padding:0 16px;border-radius:6px;font-size:15px;color:#333;margin-bottom:0}
.sub a.on{background:rgba(0,0,0,.06);font-weight:600}
.sub a:hover{background:rgba(0,0,0,.04)}
.sub .sep{height:1px;background:#ececec;margin:14px 16px}
.sub .xlink{font-size:13px;color:#777;padding:0 16px;line-height:1.5}
.sub .xlink a{display:inline;height:auto;padding:0;color:#3a6fd8;font-size:13px}
.main{flex:1;padding:56px 36px 80px;min-width:0}
.main.home{padding:72px 40px}
/* common */
.h1{font-size:32px;font-weight:700;line-height:1.25}
.h1 .step{color:#949494;margin-right:10px}
.desc{font-size:14px;color:#666;margin-top:10px}
.desc u{color:#191919}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:6px;font-size:15px;font-weight:700}
.btn.y{background:#fee500}
.btn.g{background:#f5f5f5}
.btn.line{border:1px solid #d6d6d6;background:#fff;font-weight:500}
.btn.sm{height:36px;font-size:13px;padding:0 14px}
.btn.dis{background:#f0f0f0;color:#bbb;pointer-events:none}
.card{background:#fff;border-radius:12px}
/* form */
.formwrap{display:flex;gap:28px;align-items:flex-start;margin-top:44px}
.form{flex:1 1 380px;max-width:555px;min-width:0}
.fsec{padding:28px 0;border-bottom:1px solid #e5e5e5}
.fsec:first-child{padding-top:0}
.fsec .lab{font-size:16px;font-weight:700;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.req{color:#ff5a2a}
.help{font-size:12px;color:#777;line-height:1.6;margin-top:8px}
.radio{display:inline-flex;align-items:center;gap:7px;margin-right:22px;font-size:14px;cursor:pointer}
.radio i{width:18px;height:18px;border:1px solid #c6c6c6;border-radius:50%;display:inline-block;position:relative;background:#fff}
.radio.on i{border-color:#3ba7b5}
.radio.on i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#3ba7b5}
.q{display:inline-flex;width:16px;height:16px;border:1px solid #999;border-radius:50%;font-size:11px;color:#777;align-items:center;justify-content:center}
.input{height:38px;border:1px solid #d6d6d6;border-radius:4px;padding:0 12px;font-size:14px;display:flex;align-items:center;background:#fff}
.input.ro{background:#ececec;color:#888}
.drop{border:1px dashed #c6c6c6;border-radius:6px;background:#fafafa;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#777;font-size:14px;cursor:pointer}
.drop:hover{background:#f3f3f3}
.drop b{color:#191919}
.filerow{display:flex;align-items:center;justify-content:space-between;border:1px solid #e5e5e5;border-radius:6px;padding:14px 16px;background:#fff}
.filerow .nm{display:flex;align-items:center;gap:10px;font-weight:600}
.xls{width:26px;height:26px;border-radius:4px;background:#1f9d55;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:#f7f7f7;border-radius:6px;padding:10px 12px;font-size:12px;color:#666}
.stat b{display:block;font-size:18px;color:#191919;margin-top:2px}
.stat.warn b{color:#e0442c}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:14px;cursor:pointer}
.chk i{width:18px;height:18px;border:1px solid #c6c6c6;border-radius:3px;flex:none;margin-top:1px;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-style:normal}
.chk.on i{background:#3ba7b5;border-color:#3ba7b5}
.chk.on i::after{content:"✓"}
.chk span small{display:block;color:#888;font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid #d6d6d6;font-size:13px;display:inline-flex;align-items:center;cursor:pointer;background:#fff}
.chip.on{background:#191919;color:#fff;border-color:#191919}
.tpl{border:1px solid #e5e5e5;border-radius:8px;padding:14px 16px;margin-bottom:8px;cursor:pointer;background:#fff;display:flex;gap:12px;align-items:flex-start}
.tpl:hover{border-color:#bbb}
.tpl.on{border:2px solid #191919;padding:13px 15px}
.tpl .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.tpl .s{font-size:12px;color:#777;margin-top:4px;line-height:1.5}
.badge{white-space:nowrap;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px}
.b-ok{background:#e6f6ee;color:#1d8a4e}
.b-ing{background:#fff4d6;color:#a87400}
.b-no{background:#fdecea;color:#c73a2b}
.b-at{background:#fee500;color:#191919}
.b-gr{background:#efefef;color:#666}
.vars{margin-top:6px}
.varrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.varrow code{background:#f1f1f1;border-radius:4px;padding:3px 7px;font-family:inherit;font-weight:600;width:110px}
.varrow .arr{color:#aaa}
.varrow .input{flex:1;height:34px}
.summary{background:#f7f7f7;border-radius:8px;padding:16px 18px}
.summary .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.summary .r.t{border-top:1px solid #e1e1e1;margin-top:6px;padding-top:12px;font-weight:700;font-size:16px}
.summary .r span:first-child{color:#666}
.notice{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:14px 16px;font-size:12px;color:#666;line-height:1.7}
.notice b{color:#191919}
.footbtn{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #191919;margin-top:40px;padding-top:20px;width:100%}
/* stepper */
.stepper{display:flex;gap:0;margin-top:28px;max-width:555px}
.stepper div{flex:1;font-size:13px;color:#aaa;padding-top:10px;border-top:3px solid #e5e5e5}
.stepper div.on{color:#191919;font-weight:700;border-color:#191919}
.stepper div.done{color:#191919;border-color:#191919}
/* phone */
.phone{width:250px;flex:none;border:1px solid #d9d9d9;border-radius:36px;background:#fff;padding:12px;position:sticky;top:110px}
.screen{background:#b2c7da;border-radius:26px;height:500px;padding:14px 10px;overflow:hidden;display:flex;flex-direction:column}
.screen .top{font-size:12px;color:#333;text-align:center;padding:6px 0 14px;font-weight:600}
.msg{display:flex;gap:6px}
.msg>div{flex:1;min-width:0}
.msg .avatar{width:30px;height:30px;border-radius:12px;flex:none}
.msg .who{font-size:11px;color:#444;margin-bottom:4px}
.bubble{background:#fff;border-radius:4px 12px 12px 12px;width:100%;max-width:190px;overflow:hidden;font-size:12px;line-height:1.55}
.bubble .hd{background:#fee500;font-weight:700;padding:8px 12px;font-size:12px}
.bubble .bd{padding:12px;white-space:pre-line;color:#191919}
.bubble .bd .v{background:#fff3a8;border-radius:2px}
.bubble .bt{margin:0 12px 12px;border-radius:4px;background:#f2f2f2;text-align:center;padding:8px;font-size:12px}
.bubble .chadd{border-top:1px solid #eee;padding:9px 12px;font-size:11px;color:#555;display:flex;justify-content:space-between}
.bubble .chadd b{color:#191919}
.phonecap{font-size:12px;color:#777;text-align:center;margin-top:10px}
/* tables */
table.tb{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tb th{background:#fafafa;color:#666;font-weight:500;padding:12px 10px;border-top:1px solid #191919;border-bottom:1px solid #e5e5e5;text-align:left;white-space:nowrap}
.tb td{white-space:nowrap;padding:14px 10px;border-bottom:1px solid #eee;vertical-align:middle}
.tb tr.hl td{background:#fffbe0}
.filters{display:flex;gap:8px;margin:28px 0 14px;align-items:center}
.sel{height:34px;border:1px solid #d6d6d6;border-radius:4px;padding:0 30px 0 10px;font-size:13px;display:flex;align-items:center;background:#fff;position:relative}
.sel::after{content:"⌄";position:absolute;right:10px;top:7px;color:#999}
.infobox{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:18px 20px;margin-top:24px;font-size:13px;line-height:1.75;color:#555}
.infobox b{color:#191919;font-size:14px}
/* home */
.hero{font-size:38px;font-weight:700;line-height:1.3}
.hero span{color:#949494}
.qcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:40px;max-width:1190px}
.qc{min-width:0;height:161px;background:#fff;border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative}
.qc:hover{box-shadow:0 4px 18px rgba(0,0,0,.06)}
.qc strong{font-size:19px;font-weight:700;display:block;white-space:nowrap}
.qc span{font-size:14px;color:#949494;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qc.at{background:#fff9cc}
.qc .new{position:absolute;top:18px;right:18px;margin:0;font-size:11px;color:#fff;padding:3px 8px}
.sech{font-size:24px;font-weight:700;margin:56px 0 18px;display:flex;align-items:center;gap:12px}
.sech small{font-size:24px;font-weight:400;color:#191919;border-left:1px solid #ccc;padding-left:12px}
.banner2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1190px}
.bn{min-height:270px;gap:20px;border-radius:14px;padding:36px;display:flex;flex-direction:column;justify-content:space-between;background:#fff}
.bn .k{font-size:16px;color:#666}
.bn .big{font-size:26px;font-weight:700;line-height:1.35;margin-top:14px}
.bn .big em{font-style:normal;color:#4a74d9}
.bn.at{background:#fff6b3}
/* modal / toast */
.done{width:555px}
.donebox{background:#fff;border-radius:12px;padding:36px;text-align:center}
.donebox .ok{width:56px;height:56px;border-radius:50%;background:#fee500;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
.donebox h3{font-size:24px;font-weight:700}
.donebox p{color:#666;margin-top:8px;line-height:1.6}
.bridge{margin-top:18px;border:2px solid #fee500;background:#fffdf0;border-radius:12px;padding:22px 24px;text-align:left}
.bridge h4{font-size:17px;font-weight:700;line-height:1.45}
.bridge h4 em{font-style:normal;background:#fee500;padding:0 4px}
.bridge p{font-size:13px;color:#666;margin:8px 0 16px;line-height:1.6}
.bridge .acts{display:flex;gap:8px}
.bridge.saved{border-color:#cfe9d9;background:#f3fbf6}
.crumb{font-size:13px;color:#888;margin-bottom:14px}
.crumb a{color:#3a6fd8}
.mbanner{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:16px 20px;margin-top:22px}
.mbanner .l{display:flex;gap:12px;align-items:center}
.mbanner .l .ic{width:36px;height:36px;border-radius:10px;background:#fee500;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.mbanner b{font-size:15px}
.mbanner small{display:block;color:#777;font-size:13px;margin-top:2px}
.typecards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.tc{background:#fff;border:1px solid #e5e5e5;border-radius:10px;overflow:hidden}
.tc .im{height:130px;background:#f2f4f6}
.tc .tx{padding:16px}
.tc .tx b{font-size:16px}
.tc .tx small{display:block;color:#777;margin-top:6px}
.guide{position:fixed;right:20px;bottom:20px;width:300px;background:#191919;color:#fff;border-radius:12px;padding:16px 18px;font-size:12.5px;line-height:1.6;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.guide b{color:#fee500}
.guide .x{position:absolute;top:8px;right:12px;color:#999;cursor:pointer}
.mock{position:fixed;left:50%;transform:translateX(-50%);top:78px;background:#ff5a2a;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px;z-index:20;opacity:.9}
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:6px;max-width:1190px}
.sc{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
.sc:hover{border-color:#191919;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.sc.off{opacity:.55;cursor:default}.sc.off:hover{border-color:#e5e5e5;box-shadow:none}
.scbub{margin:16px 16px 0;background:#fff;border-radius:4px 10px 10px 10px;box-shadow:0 0 0 10px #b2c7da;font-size:11.5px;line-height:1.55;overflow:hidden;height:118px;margin-top:26px;margin-bottom:26px}
.scbub .hd{background:#fee500;font-weight:700;padding:6px 10px;font-size:11px}
.scbub .bd{padding:8px 10px;color:#333}
.sctx{padding:14px 16px 18px;border-top:1px solid #eee}
.sctx .when{font-size:12px;color:#3a6fd8;font-weight:600;margin-bottom:4px}
.sctx b{font-size:16px;margin-right:6px}
.sctx .badge{vertical-align:2px}
.sctx .to{font-size:12px;color:#888;margin-top:6px}
.nogo{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px dashed #d0d0d0;border-radius:10px;padding:16px 20px;margin-top:24px;max-width:1190px}
.nogo b{display:block;font-size:14px}.nogo span{font-size:13px;color:#888}
.addc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border:1px dashed #c6c6c6;background:#fafafa;min-height:260px}
.addc .plus{width:44px;height:44px;border-radius:50%;background:#fee500;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.addc b{font-size:16px}.addc span{font-size:13px;color:#777;line-height:1.5}
.ta{width:100%;height:200px;border:1px solid #d6d6d6;border-radius:4px;padding:12px;font-family:inherit;font-size:14px;line-height:1.6;resize:vertical}
input.input{font-family:inherit;outline:none}
.vbar{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.vchip{font-size:12px;font-weight:600;background:#f1f1f1;border-radius:4px;padding:4px 8px;cursor:pointer}
.vchip:hover{background:#e4e4e4}
.adw{margin-top:10px;background:#fdecea;border:1px solid #f5c2bc;border-radius:6px;padding:12px 14px;font-size:13px;line-height:1.6;color:#555}
.adw b{color:#c73a2b}
.secT{font-size:20px;font-weight:700;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.secT small{font-size:13px;font-weight:400;color:#888}
.sc{position:relative}
.rank{position:absolute;top:10px;left:10px;z-index:2;width:26px;height:26px;border-radius:50%;background:#191919;color:#fee500;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1190px}
.cat{min-width:0;display:flex;gap:14px;align-items:center;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:18px;cursor:pointer}
.cat:hover{border-color:#191919}
.cat .em{font-size:26px;width:46px;height:46px;border-radius:12px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex:none}
.cat b{font-size:16px}.cat .cnt{font-size:12px;color:#3a6fd8;font-weight:600;margin-left:6px}
.cat .ex{font-size:12px;color:#888;margin-top:4px;line-height:1.6}
.cat .ex span{white-space:nowrap}
.cat .arr{color:#bbb;font-size:20px}
.cat.ghost{border-style:dashed;background:#fafafa}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;width:680px;padding:28px 30px;max-height:80vh;overflow:auto}
.modal h3{font-size:20px}
.hero2{display:flex;gap:28px;background:#fff6b3;border-radius:16px;padding:32px;align-items:stretch;flex-wrap:wrap}
.hero2 .hl{flex:1 1 260px;display:flex;flex-direction:column}
.hero2 .tag{display:inline-block;align-self:flex-start;background:#fff;border-radius:14px;padding:5px 12px;font-size:13px;font-weight:600}
.hero2 .big{font-size:30px;font-weight:800;line-height:1.35;margin-top:16px}
.hero2 .big em{font-style:normal;background:#fee500;padding:0 4px}
.hero2 p{font-size:15px;color:#555;line-height:1.6;margin-top:12px}
.hero2 .catsw{margin-top:auto;padding-top:18px;font-size:12px;color:#777;line-height:1.9}
.hero2 .catsw a{color:#3a6fd8;margin-left:8px}
.hero2 .hr{flex:2 1 520px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;background:#b2c7da;border-radius:14px;padding:16px}
.hb{cursor:pointer;display:flex;flex-direction:column;border-radius:10px;padding:6px;transition:.15s}
.hb:hover{background:rgba(255,255,255,.25)}
.hb .who{display:flex;align-items:center;gap:6px;font-size:11px;color:#333;margin-bottom:6px}
.bubble.mini{width:auto;font-size:11.5px;flex:1}
.bubble.mini .bd{padding:9px 10px}
.hbname{font-size:12px;color:#1d2b3a;margin-top:10px;line-height:1.4}

function phone(){
 const t=S.tpl?Object.values(TPL).flat().find(x=>x.id===S.tpl):null;
 let body='템플릿을 선택하면<br>미리보기가 표시돼요.';
 if(t){
  body=t.body.replace(/#\{(.+?)\}/g,(m,k)=>{const v=VARS[k]||m;const mr=(S.recvMode==='manual'&&S.rows&&S.rows[0])?S.rows[0][k]:null;const sample=mr||{'이름':'김민지','금액':'280,000'}[k];return `<span class="v">${sample||(/엑셀/.test(v)?m:v)}</span>`});
 }
 return `<div><div class="phone"><div class="screen">
  <div class="top">대호</div>
  <div class="msg"><span class="avatar"></span><div><div class="who">대호</div>
   <div class="bubble"><div class="hd">알림톡 도착</div><div class="bd">${body}</div>
   ${t&&t.btn?`<div class="bt">${t.btn}</div>`:''}
   <div class="chadd"><span>대호 채널</span><b>+ 채널 추가</b></div></div>
  </div></div>
 </div></div><div class="phonecap">받는 사람 화면 미리보기 (첫 번째 행 기준)</div></div>`;
}

function aiAnalyze(b){
 const it=[]; const sents=b.split(/(?<=[.!?。\n])\s*/).filter(Boolean);
 sents.filter(x=>ADW.some(w=>x.includes(w))).forEach(sen=>{const ws=ADW.filter(w=>sen.includes(w));it.push({k:'ad',lab:'광고 표현',msg:`「${sen.trim()}」 — ${ws.map(w=>'「'+w+'」').join(' ')} 때문에 광고로 판단돼요. 이 문장은 빼고 친구에게 메시지로 보내세요.`,fix:'이 문장 빼기',f:x=>x.replace(sen,'').replace(/\s{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim()})});
 const dm=b.match(/\d{1,2}월\s?\d{1,2}일(\([^)]+\))?/); if(dm) it.push({k:'var',lab:'자리표시',msg:`「${dm[0]}」은 #{날짜}로 바꾸면 매번 다시 검수받지 않아도 돼요.`,fix:'#{날짜}로 바꾸기',f:x=>x.replace(dm[0],'#{날짜}')});
 const mm=b.match(/\d{1,3}(,\d{3})+원|\d{4,}원/); if(mm) it.push({k:'var',lab:'자리표시',msg:`금액 「${mm[0]}」은 #{금액}원으로 두면 사람마다 다르게 넣을 수 있어요.`,fix:'#{금액}원으로 바꾸기',f:x=>x.replace(mm[0],'#{금액}원')});
 const tm=b.match(/(오전|오후)\s?\d{1,2}시(\s?\d{1,2}분)?/); if(tm) it.push({k:'var',lab:'자리표시',msg:`시간 「${tm[0]}」은 #{시간}으로 바꾸는 걸 추천해요.`,fix:'#{시간}으로 바꾸기',f:x=>x.replace(tm[0],'#{시간}')});
 if(!/#\{이름\}/.test(b)&&b.trim()) it.push({k:'tip',lab:'승인 팁',msg:'#{이름}님으로 시작하면 개인 안내로 인정받기 쉬워요.',fix:'#{이름}님으로 시작하기',f:x=>/^[^,\n]*여러분,?\s*/.test(x)?x.replace(/^[^,\n]*여러분,?\s*/,'#{이름}님, '):'#{이름}님, '+x});
 if(/모든|전체|여러분|공지/.test(b)) it.push({k:'warn',lab:'반려 주의',msg:'모두에게 보내는 공지로 보이면 반려될 수 있어요. 받는 분의 예약·수강 정보를 넣어주세요.'});
 if(b.trim()&&!/문의|채팅|연락/.test(b)) it.push({k:'tip',lab:'문구 다듬기',msg:'끝에 문의 방법을 한 줄 넣어주세요.',fix:'문의 문구 넣기',f:x=>x.trim()+'\n\n문의는 채널 채팅으로 남겨주세요.'});
 if(b.trim().length>0&&b.trim().length<25) it.push({k:'tip',lab:'문구 다듬기',msg:'무엇에 대한 안내인지 한 줄 더 적어주면 검수와 받는 분 모두 이해하기 쉬워요.'});
 const ad=it.filter(x=>x.k==='ad').length, w=it.filter(x=>x.k==='warn').length, v=it.filter(x=>x.k==='var').length;
 const score=100-ad*45-w*20-v*8-(/#\{/.test(b)?0:15);
 let polished=b; it.forEach(x=>{if(x.f&&x.k!=='tip'||x.f&&/이름|문의/.test(x.fix))polished=x.f(polished)});

}

function memoKey(r){
 if(r==='home')return'home';
 if(r==='at-send'){if(S.sent)return'done';if(S.step===0)return(S.hasHistory&&!S.browse)?'quick':'gallery';return S.step===1?'step1':'step2'}
 return {'at-list':'list','at-detail':'detail','at-tpl':'tpl','at-new':'newtpl','at-report':'report','msg-new':'msgnew','msg-compose':'compose','msg-target':'target','msg-file':'file'}[r];
}
function memoToggle(){S.memoOpen=!S.memoOpen;addMemo()}
function addMemo(){
 const m=MEMO[memoKey(route())];
 let f=document.getElementById('memofab'), d=document.getElementById('memodrawer');
 if(!f){f=document.createElement('button');f.id='memofab';f.onclick=memoToggle;document.body.appendChild(f);
  d=document.createElement('div');d.id='memodrawer';document.body.appendChild(d)}
 f.style.display=m?'':'none'; f.innerHTML=`📝 사업 메모 <span>${m?m.length:0}</span>${m&&m.some(x=>x.startsWith('[AI'))?'<i class="aidot">AI</i>':''}`; f.className=S.memoOpen?'on':'';
 d.className=(S.memoOpen&&m)?'open':'';
 d.innerHTML=m?`<div class="mh"><b>📝 사업 메모</b><a onclick="memoToggle()">✕</a></div><div class="msub">이 화면의 의도와 미정 사항</div><ul>${m.map(x=>`<li>${x.replace(/^\[(AI[^\]]*)\]/,'<span class="aitag">$1</span>')}</li>`).join('')}</ul>`:'';
}
function setScen(h){Object.assign(S,{myTpl:null,hasHistory:h,browse:false,step:0,tpl:null,uploaded:false,sent:false,again:false});document.getElementById('sc0').className=h?'':'on';document.getElementById('sc1').className=h?'on':'';go('at-send');render()}

const DEEP={
 'at-step1':()=>Object.assign(S,{hasHistory:false,browse:false,tpl:'t1',cat:'교육',step:1,sent:false,recvMode:'manual',uploaded:false}),
 'at-step2':()=>Object.assign(S,{hasHistory:false,tpl:'t1',cat:'교육',step:2,sent:false,recvMode:'excel',uploaded:true,fromList:null,fileName:'학부모명단_2610.xlsx',fileCnt:300}),
 'at-done':()=>Object.assign(S,{hasHistory:false,tpl:'t1',cat:'교육',step:2,sent:true,failOpen:true,recvMode:'excel',uploaded:true,fromList:null,fileName:'학부모명단_2610.xlsx',fileCnt:300}),
 'at-quick':()=>Object.assign(S,{hasHistory:true,browse:false,step:0,sent:false,tpl:null})
};
function render(){let r=route();if(DEEP[r]){DEEP[r]();history.replaceState(null,'','#at-send');r='at-send';const a=document.getElementById('sc0'),b=document.getElementById('sc1');if(a&&b){a.className=S.hasHistory?'':'on';b.className=S.hasHistory?'on':''}}document.getElementById('app').innerHTML=(P[r]||P.home)();window.scrollTo(0,0);addMemo();if(r==='at-new')drawWarn()}
render();
</script>
